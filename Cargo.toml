[package]
name = "security-student"
version = "0.1.0"
edition = "2021"
description = "Static site generator behind gilbertordx.github.io: portfolio + log"

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.dev]
opt-level = 1
