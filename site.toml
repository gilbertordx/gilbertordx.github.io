# Markdown. Shown on /about/
about = """
I build manufacturing software, CAD automation and a custom ERP, and I am
moving into defensive cybersecurity. I am aiming at junior SOC and IAM roles.

I completed the AWS Academy Cloud Foundations course (Nov 2025), through
Fatec. I am building a Kali Linux lab in VirtualBox and studying networks, with a
mentor-guided plan. Open to work anywhere.

I have worked in manufacturing for about ten years, almost all of it at
Markethouse, a company that builds displays and furniture for supermarkets. I
started on the shop floor at 18 as a carpenter's assistant and moved up into
mechanical design. I built the company's CAD infrastructure from scratch and
wrote the automation that cut documentation time per unit by 90%. I currently
lead a team of two: one person in production planning and control (PPC) and one
mechanical engineering intern.

I grew up with a computer and no money for games or software. I read forums,
experimented with HTML, and liked taking things apart to see how they work. In
2020 I started a Computer Science degree and dropped out when work took over. In
2023 I tried again, left my job to study, and entered Fatec, a public college,
in Database Technology. Markethouse later invited me back in a senior role.

My best work so far is a production planning system for Markethouse, built
as a freelancer alongside more experienced people.

Away from work I lift weights, spend time with my wife, our cats and dogs, and
watch birds in the yard.

This site is a **portfolio** and a **log** of what I am learning.
"""

