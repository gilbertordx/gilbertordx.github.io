# Markdown. Shown on /about/
about = """
I have worked in manufacturing for about ten years, almost all of it at
Markethouse, a company that builds displays and furniture for supermarkets. I
started on the shop floor at 18 as a carpenter's assistant and moved up into
mechanical design. I built the company's CAD infrastructure from scratch, wrote the automation that
cut documentation time per unit by 90%, and I currently lead a team of
mechanical engineers.

Software was always the interest behind it. I grew up with a computer and no
money for games or software, so I learned to get by with cracked copies, and I
liked tweaking cheat scripts more than playing. I read forums, experimented with
HTML, and wanted to know how one server could host a game for hundreds of
players. I never built anything back then, but I have always liked taking
things apart to see how they work.

In 2020 I started a Computer Science degree. Then the pandemic hit, demand from
supermarkets surged, work took over, and I dropped out. In 2023 I tried again
properly: I saved money, left my job to study, and earned a place at FATEC, a
public college, where I completed a degree in Database Technology. Markethouse
later invited me back in a senior role.

Now I am moving into software for good. My best work so far is a production
planning system I built for Markethouse as a freelancer, working alongside more experienced
engineers so I could learn from them as I went. I am also starting a mentorship
with a senior professor. The plan is simple: build, learn, and repeat.

Away from work I lift weights, a lot. I spend time with my wife, our cats and
dogs, and lately I watch birds in the yard, barefoot.

This site is a **portfolio** of what I have built and a **log** of what I am
learning along the way. The site itself is generated by a small program I wrote
in Rust.
"""

